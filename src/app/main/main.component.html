<mat-toolbar color="primary">
    <span>提醒事项</span>
  </mat-toolbar>
  
  <div class="main-content">
    <!-- 表单区域 -->
    <mat-card class="form-card mat-elevation-z4">
      <mat-card-content>
        <app-reminder-form
          [editing]="editing"
          (formSubmit)="handleSubmit($event)">
        </app-reminder-form>
      </mat-card-content>
    </mat-card>
  
    <!-- 列表区域 -->
    <mat-card class="list-card mat-elevation-z4">
      <mat-card-content>
        <app-reminder-list
          [reminders]="reminders"
          (edit)="handleEdit($event)"
          (delete)="handleDelete($event)">
        </app-reminder-list>
      </mat-card-content>
    </mat-card>
  </div>
