<div class="container text-center py-5">
    <!-- 使用 Material 的 Card 组件包裹内容 -->
    <mat-card class="mat-elevation-z4">
      <mat-card-header>
        <mat-card-title>请使用 Google 登录</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <!-- 使用 Material Button 组件替换原来的按钮 -->
        <button mat-raised-button color="primary" (click)="handleLogin()" class="my-3">
          Google 登录
        </button>
  
        <!-- Google 登录按钮的位置 -->
        <div id="g_id_login_btn"></div>
      </mat-card-content>
    </mat-card>
  </div>
