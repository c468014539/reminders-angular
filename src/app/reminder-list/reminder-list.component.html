<mat-form-field appearance="fill" class="search-bar">
    <mat-label>搜索提醒</mat-label>
    <input matInput placeholder="输入标题或描述" [formControl]="searchControl" />
    <button mat-icon-button matSuffix *ngIf="searchControl.value" (click)="searchControl.setValue('')">
      <mat-icon>close</mat-icon>
    </button>
  </mat-form-field>
  
  <!-- 筛选选项 -->
  <div class="filter-options">
    <button mat-button (click)="onFilterChange('all')">全部</button>
    <button mat-button (click)="onFilterChange('today')">今天</button>
    <button mat-button (click)="onFilterChange('week')">本周</button>
    <button mat-button (click)="onFilterChange('month')">本月</button>
  </div>
  
  <div *ngIf="!filteredReminders.length" class="text-center text-muted">
    暂无匹配的提醒事项
  </div>
  
  <div *ngIf="filteredReminders.length" class="reminder-grid">
    <mat-card class="reminder-card mat-elevation-z3" *ngFor="let r of filteredReminders">
      <mat-card-header>
        <mat-card-title>{{ r.title }}</mat-card-title>
      </mat-card-header>
  
      <mat-card-content>
        <p>{{ r.description || '无描述' }}</p>
        <p class="text-muted"><small>{{ r.date }} {{ r.time }}</small></p>
      </mat-card-content>
  
      <mat-card-actions align="end">
        <button mat-stroked-button color="primary" (click)="onEdit(r)">编辑</button>
        <button mat-stroked-button color="warn" (click)="onDelete(r.id)">删除</button>
      </mat-card-actions>
    </mat-card>
  </div>
